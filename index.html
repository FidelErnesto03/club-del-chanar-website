<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="El Club del Chañar · Comunidad que cultiva calma y creatividad en Lomas del Chañar, Córdoba." />
  <title>El Club del Chañar - Calma y productividad natural</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/logo.png" />
</head>

<body>
  <header class="hero" id="inicio">
    <nav class="nav" aria-label="Navegación principal">
      <a class="nav__brand" href="#inicio" aria-label="Volver al inicio">
        <img src="assets/logo.png" alt="Logo de El Club del Chañar" loading="lazy" />
      </a>
      <button class="nav__toggle" aria-expanded="false" aria-controls="primary-menu">Menú</button>
      <div class="nav__links" id="primary-menu">
        <a href="#urgencia">El Club</a>
        <a href="#servicios">Espacios</a>
        <a href="#eventos">Eventos</a>
        <a href="#incluye">Beneficios</a>
        <a href="#funciona">Proceso</a>
        <a href="#planes">Planes</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
      </div>
    </nav>
    <div class="hero__content">
      <div class="hero__text">
        <p class="eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="hero__metric" id="hero-subtitle"></p>
        <p class="hero__description" id="hero-description"></p>
        <div class="hero__cta-group">
          <a class="btn" href="#" target="_blank" rel="noopener" id="hero-cta"></a>
          <a class="btn btn--ghost" data-scroll="#contacto" href="#contacto"></a>
        </div>
        <p class="hero__note"></p>
      </div>
      
      <div class="hero__figure">
        <div class="hero__logo-container">
          <div class="hero__logo-circle">
            <img src="assets/logo.png" alt="Logo del Club del Chañar" />
          </div>
          <div class="golden-ratio"></div>
        </div>
      </div>
    </div>
    <div class="hero__seeds" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <main>
    <!-- Sección El Club -->
    <section class="section activation" id="urgencia">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
      </div>

      <div class="activation__layout section__body">
        <div class="activation__visual">
          <div class="club-description-card">
            <h3></h3>
            <p></p>
          </div>
          <a href="#contacto" class="croquis-link" data-scroll="#contacto">
            <figure class="croquis-figure">
              <img src="" alt="" loading="lazy" />
              <figcaption></figcaption>
            </figure>
          </a>
        </div>

        <div class="activation__content">
          <div class="activation__features"></div>
          <a class="btn btn--primary" href="https://forms.gle/5hCsEExiJoxedYnDA" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>

    <!-- Sección Espacios -->
    <section class="section spaces-compact" id="servicios">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
        <p class="section__lead"></p>
      </div>

      <div class="spaces-grid section__body" id="spaces-grid"></div>
    </section>

    <!-- Sección Eventos -->
    <section class="section events" id="eventos">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
        <p class="section__lead"></p>
      </div>

      <div class="events__grid section__body" id="events-grid"></div>
    </section>

    <!-- Sección Beneficios -->
    <section class="section include-list" id="incluye">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
      </div>

      <div class="benefits-grid section__body" id="benefits-grid"></div>
    </section>

    <!-- Sección Proceso -->
    <section class="section process" id="funciona">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
      </div>

      <ul class="process-steps section__body" id="process-steps"></ul>
    </section>

    <!-- Sección Planes -->
    <section class="section plans" id="planes">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
        <p class="section__lead"></p>
      </div>

      <div class="plans__grid section__body" id="plans-grid"></div>

      <div class="special-offer section__body" id="special-offer"></div>
    </section>

    <!-- Sección Galería -->
    <section class="section gallery" id="galeria">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
        <p class="section__lead"></p>
      </div>

      <div class="gallery__sections section__body" id="gallery-sections"></div>
    </section>

    <!-- Sección Contacto -->
    <section class="section contact" id="contacto">
      <div class="section__header">
        <p class="eyebrow"></p>
        <h2></h2>
      </div>

      <div class="contact__grid section__body">
        <div class="contact__info">
          <p class="contact__description"></p>
          <div class="contact__channels">
            <a class="btn btn--whatsapp contact__whatsapp" href="#" target="_blank" rel="noopener">
              <span>WhatsApp</span>
            </a>
            <a class="btn btn--ghost contact__form" href="#" target="_blank" rel="noopener">
              Formulario de contacto
            </a>
          </div>
          <div class="contact__details">
            <p class="contact__hours"></p>
            <p class="contact__response-time"></p>
          </div>
        </div>
        <div class="contact__map">
          <div class="map-placeholder">
            <p>📍 Lomas del Chañar · Córdoba · Argentina</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__content">
      <p class="footer__copyright">© 2025 El Club del Chañar. Todos los derechos reservados.</p>
      <p class="footer__location">📍 Lomas del Chañar · Córdoba · Argentina</p>
      <a class="footer__email" href="mailto:clubdelchanar@gmail.com">clubdelchanar@gmail.com</a>
    </div>
  </footer>

  <div id="gallery-modal" class="gallery-modal" hidden>
    <div class="gallery-modal__overlay" data-gallery-close></div>
    <div class="gallery-modal__content">
      <button class="gallery-modal__close" aria-label="Cerrar galería" data-gallery-close>×</button>
      <button class="gallery-modal__prev" aria-label="Imagen anterior" data-gallery-prev>‹</button>
      <figure>
        <img id="gallery-modal-image" alt="" hidden />
        <video id="gallery-modal-video" controls style="display:none;"></video>
        <figcaption id="gallery-modal-caption"></figcaption>
      </figure>
      <button class="gallery-modal__next" aria-label="Siguiente imagen" data-gallery-next>›</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
