<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HydrateUI</title>
</head>
<body>
    <h1>Test de HydrateUI</h1>
    
    <!-- Elementos que existen en el HTML real -->
    <h2 id="hero-title">Título por defecto</h2>
    <p id="hero-subtitle">Subtítulo por defecto</p>
    <a id="hero-cta" href="#">CTA por defecto</a>
    <p id="hero-description">Descripción por defecto</p>
    
    <div id="result">Cargando...</div>
    
    <script src="js/app.js"></script>
    <script>
        // Esperar a que app.js se cargue
        setTimeout(() => {
            const heroTitle = document.getElementById("hero-title").textContent;
            const heroSubtitle = document.getElementById("hero-subtitle").textContent;
            const heroCta = document.getElementById("hero-cta").textContent;
            const heroDescription = document.getElementById("hero-description").textContent;
            
            document.getElementById("result").innerHTML = 
                '<h3>Resultado:</h3>' +
                '<p>hero-title: ' + heroTitle + '</p>' +
                '<p>hero-subtitle: ' + heroSubtitle + '</p>' +
                '<p>hero-cta: ' + heroCta + '</p>' +
                '<p>hero-description: ' + heroDescription + '</p>';
        }, 1000);
    </script>
</body>
</html>
